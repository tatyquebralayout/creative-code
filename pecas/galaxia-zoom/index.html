<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!-- Defines the character encoding for the document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galáxia Rotativa</title> <!-- Defines the title of the document -->
    <meta name="description" content="Estrelas girando em volta de um centro, com zoom no controle deslizante. Peça de Tatiana Barros na galeria creative code.">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css"> <!-- Links the CSS stylesheet -->
</head>
<body>
    <canvas id="galaxyCanvas"></canvas> <!-- Canvas element for the galaxy simulation -->
    <label for="zoomControl">Zoom:</label> <!-- Label for the zoom control -->
    <input type="range" id="zoomControl" min="0.5" max="2.0" step="0.1" value="1.0"> <!-- Zoom control -->
    <script src="js/script.js"></script> <!-- Links the JavaScript file -->
</body>
</html>
